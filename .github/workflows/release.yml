name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            artifact: foxos-linux-amd64
          - goarch: arm64
            artifact: foxos-linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Test
        run: |
          go mod tidy
          go mod verify
          go test ./...
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.artifact }}" ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  routeros-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            name: foxos-amd64.tar
          - platform: linux/arm64
            name: foxos-arm64.tar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build RouterOS image archive
        run: docker buildx build --platform "${{ matrix.platform }}" --output "type=docker,dest=${{ matrix.name }}" .
      - name: Assemble amd64 full-stack bundle
        if: matrix.platform == 'linux/amd64'
        run: |
          mkdir -p foxos-full-amd64
          cp foxos-amd64.tar foxos-full-amd64/
          cp mihomo/install/mihomo_amd64.tar foxos-full-amd64/
          cp mihomo/install/mosdns-v0.6.4-2ac30e8-amd64.tar foxos-full-amd64/mosdns-amd64.tar
          cp deploy/routeros/full-install.template.rsc foxos-full-amd64/
          cp deploy/routeros/foxos-start-all.rsc foxos-full-amd64/
          cp deploy/routeros/prepare-install.ps1 foxos-full-amd64/
          cp deploy/routeros/QUICK-INSTALL.md foxos-full-amd64/
          find foxos-full-amd64 -name .DS_Store -delete
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux/amd64'
        with:
          name: foxos-full-amd64-${{ github.sha }}
          path: foxos-full-amd64/
          retention-days: 14
