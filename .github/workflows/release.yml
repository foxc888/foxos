name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Required quality gates
    uses: ./.github/workflows/core-ci.yml
    permissions:
      contents: read

  binaries:
    name: Build FoxOS binary (${{ matrix.goarch }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            artifact: foxos-linux-amd64
          - goarch: arm64
            artifact: foxos-linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${{ matrix.artifact }}" ./cmd/server
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  routeros-images:
    name: Build RouterOS image (${{ matrix.platform }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            name: foxos-amd64.tar
          - platform: linux/arm64
            name: foxos-arm64.tar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Install bundle tools
        run: sudo apt-get update -qq && sudo apt-get install --yes ripgrep
      - uses: docker/setup-buildx-action@v4
      - name: Build FoxOS image archive
        run: docker buildx build --platform "${{ matrix.platform }}" --target foxos-runtime --build-arg FOXOS_VERSION="${GITHUB_REF_NAME}" --output "type=docker,dest=${{ matrix.name }}" .
      - name: Build amd64 Mihomo and MosDNS image archives
        if: matrix.platform == 'linux/amd64'
        run: |
          docker buildx build --platform linux/amd64 --target mihomo-runtime --tag "foxos-mihomo-release:${GITHUB_SHA}" --output type=docker,dest=mihomo-amd64.tar .
          docker buildx build --platform linux/amd64 --target mosdns-runtime --tag "foxos-mosdns-release:${GITHUB_SHA}" --output type=docker,dest=mosdns-amd64.tar .
      - name: Scan FoxOS release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ matrix.name }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Mihomo release image
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: mihomo-amd64.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan MosDNS release image
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: mosdns-amd64.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Assemble amd64 full-stack bundle
        if: matrix.platform == 'linux/amd64'
        env:
          FOXOS_IMAGE: ${{ github.workspace }}/foxos-amd64.tar
          MIHOMO_IMAGE: ${{ github.workspace }}/mihomo-amd64.tar
          MOSDNS_IMAGE: ${{ github.workspace }}/mosdns-amd64.tar
        run: |
          release_id="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          scripts/build-routeros-bundle.sh dist "$release_id"
          test -s "dist/foxos-full-amd64-${release_id}.tar.gz"
          test -s "dist/foxos-full-amd64-${release_id}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux/amd64'
        with:
          name: foxos-full-routeros-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, routeros-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        working-directory: release-assets
        run: |
          test -s foxos-linux-amd64
          test -s foxos-linux-arm64
          test -s foxos-amd64.tar
          test -s foxos-arm64.tar
          bundle=$(find . -maxdepth 1 -name 'foxos-full-amd64-*.tar.gz' -print -quit)
          test -n "$bundle"
          test -s "$bundle.sha256"
          sha256sum --check "$(basename "$bundle.sha256")"
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: release-assets/*
