name: FoxOS Core CI

on:
  push:
    branches: [main, agent/foxos-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Prepare and verify modules
        run: |
          go mod tidy
          go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image
        run: docker buildx build --platform linux/amd64 --output type=docker,dest=foxos-amd64.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: foxos-routeros-amd64-${{ github.sha }}
          path: foxos-amd64.tar
          retention-days: 14
