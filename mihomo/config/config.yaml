# FoxOS safe Mihomo baseline.
# Nodes and credentials are intentionally absent. Add them through FoxOS drafts or
# a locally managed configuration file. The RouterOS installer replaces `secret`.
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
external-controller: 0.0.0.0:9090
external-ui: ui
secret: ""

# TUN and DNS interception stay disabled until a separately reviewed plan exists.
tun:
  enable: false

proxies: []
proxy-groups:
  - name: FoxOS-Default
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT
