

# 性能优化配置
profile:
  store-selected: true  # 记住手动选择的节点
  store-fake-ip: true   # 持久化 fake-ip

# 禁用 IPv6 (解决 Google 等网站报错 "异常流量" 的风控问题)
ipv6: false

# TCP 并发连接
tcp-concurrent: true

# 统一延迟测试
unified-delay: true

# GeoIP 数据库配置
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true  # 开启自动更新
geo-update-interval: 24  # 每 24 小时检查更新

# GeoIP 数据库下载地址
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/GeoIP.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/GeoSite.dat"

# 通用代理端口：同时支持HTTP和SOCKS5协议
mixed-port: 7890

# 仅HTTP协议专用端口
port: 7891

# 仅SOCKS5协议专用端口
socks-port: 7892

# 透明代理端口, 以备仅 TCP 简单引流需求
redir-port: 7893

# 全面接管TCP 与 UDP 流量
tproxy-port: 7894

# 是否允许来自局域网的连接
allow-lan: true

# 监听地址，"*"表示监听所有地址
bind-address: "*"

# 运行模式：rule（规则模式）
mode: rule

# 日志级别：silent/error/warning/info/debug
# 建议使用 info 或 warning 方便排查问题
log-level: warning

# 控制面板访问地址和端口
external-controller: 0.0.0.0:9090

# MetaCubeX 界面
external-ui: ui

# 访问控制面板的密码
secret: "wallentv"

# DNS 设置（修复 TUN 模式 DNS 自举死锁）
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  prefer-h3: false          # 关闭 H3 避免 UDP 443 被拦截
  enhanced-mode: fake-ip    # redir-host
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: rule              # 启用逻辑规则模式（支持 GEOSITE）
  fake-ip-filter:
    - GEOSITE,CN,real-ip                 # 中国域名 → 真实IP（nslookup 能看到）
    - MATCH,fake-ip 
  cache-size: 16384
  
  # 基础 DNS 服务器（纯 UDP，用于引导 DoH 域名解析，不经过 TUN）
  default-nameserver:
    - 114.114.114.114    # 国内稳定 UDP DNS
    - 223.5.5.5          # 阿里 UDP DNS
  
  # 国内 DNS（DoH 加密）
  nameserver:
    - https://doh.pub/dns-query           # 腾讯 DoH
    - https://dns.alidns.com/dns-query    # 阿里 DoH
    - 114.114.114.114                     # 备用 UDP

# TUN 模式设置（优化版）
tun:
  enable: true
  stack: mixed ## mixed,  gvisor, system
  device: tun0
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  mtu: 1400
  strict-route: true

# 代理服务器设置
proxies:
  # Hysteria2 代理（高性能抗干扰协议）
  - name: "dmit-hy2"
    type: hysteria2
    server: 123.123.123.123 # 替换成您的服务器IP地址或域名
    port: 443 
    password: "123456" # 换自己VPS节点的密码
    up: 100   # 上传速度 (Mbps)
    down: 1000  # 下载速度 (Mbps)
    sni: cn.bing.com
    skip-cert-verify: true
    

  # VLESS Reality XHTTP 代理
  - name: "dmit-vless" 
    type: vless
    server: 123.123.123.123  # 换成自己的VPS IP
    port: 443
    uuid: 96c39047-fa50-4712-b5e3-234523452  # 换成自己的uuid
    network: tcp
    tls: true
    udp: true
    alpn:            
      - h2
      - http/1.1
    servername: www.amazon.com # 换成自己的 SNI 网址, www开头, 结尾没有端口号
    reality-opts:
      public-key: 883ngy5nPuvfabjFZn8mgO026RNa2WLYDb4Jgb1dZio  # 换成自己的
      short-id: 4dcedc64387a35 # 换成自己的, 取 Short IDs 的第一个
      support-x25519mlkem768: false
    client-fingerprint: chrome

  # WireGuard VPS（经 Phantun 容器 UDP→TCP 伪装）
  # endpoint 指向子路由器上的 Phantun 容器局域网 IP
  - name: "vps-wg"
    type: wireguard
    server: 192.168.88.4     # ★ Phantun 容器 IP（子路由器上）
    port: 1234                 # ★ Phantun 监听端口（LOCAL_PORT）
    ip: 10.20.30.2             # ★ VPS 分配给你的 WG 隧道 IP
    private-key: "aOAFgGd0xk4gFDNhKWpoUWYbIAjIDebOVp44bgpjsmY="  # wg客户端的私钥
    public-key: "dhT6X+jHjrnaL9jiVPVbD9yOOgxwlouTfnQYeIPFBic="    # ★ VPS端WG公钥
    allowed-ips: ['0.0.0.0/0']
    mtu: 1420
    udp: true

# 代理组设置（优化版）
proxy-groups:
  # 主选择组
  - name: Proxy
    type: select
    proxies:
      - auto
      - dmit-hy2
      - dmit-vless
      - vps-wg
      - DIRECT

  # 自动选择（延迟最低）
  - name: auto
    type: url-test
    proxies:
      - dmit-hy2
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 20



# 规则集（优化版 - 使用本地路径）
rule-providers:
  apple-proxy:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/Apple-proxy.yaml"
    path: ./ruleset/Apple-proxy.yaml
    interval: 86400  # 每天更新一次

  apple-direct:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/Apple-direct.yaml"
    path: ./ruleset/Apple-direct.yaml
    interval: 86400

  cn:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/CN.yaml"
    path: ./ruleset/CN.yaml
    interval: 86400

  ad-keyword:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/common-ad-keyword.yaml"
    path: ./ruleset/common-ad-keyword.yaml
    interval: 86400

  foreign:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/foreign.yaml"
    path: ./ruleset/foreign.yaml
    interval: 86400

  telegram:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/App/social/Telegram.yaml"
    path: ./ruleset/Telegram.yaml
    interval: 86400

  lan:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Hackl0us/SS-Rule-Snippet@master/Rulesets/Clash/Basic/LAN.yaml"
    path: ./ruleset/LAN.yaml
    interval: 86400

# 最终规则（优化顺序）
rules:
  # 1. 局域网直连（最常匹配，放在最前面）
  - RULE-SET,lan,DIRECT
  
  # 临时放行 Google Analytics 和营销平台后台（避免被下方的广告规则误杀拦截）
  - DOMAIN-SUFFIX,marketingplatform.google.com,Proxy
  - DOMAIN-SUFFIX,analytics.google.com,Proxy
  - DOMAIN-SUFFIX,googletagmanager.com,Proxy
  - DOMAIN-SUFFIX,google-analytics.com,Proxy

  # 2. 广告拦截（提前拦截，节省流量）
  - RULE-SET,ad-keyword,REJECT
  - GEOSITE,category-ads-all,REJECT  # GeoSite 广告拦截
  
  # 3. 特定应用规则
  - GEOSITE,ookla-speedtest,Proxy
  - DOMAIN-SUFFIX,speedtest.net,Proxy
  - DOMAIN-SUFFIX,ookla.com,Proxy
  - DOMAIN-KEYWORD,speedtest,Proxy
  - RULE-SET,telegram,Proxy
  - GEOSITE,telegram,Proxy  # GeoSite Telegram 规则
  - GEOSITE,google,Proxy    # Google 服务走代理
  - GEOSITE,github,Proxy    # GitHub 走代理
  
  # 4. 苹果服务分流
  - RULE-SET,apple-direct,DIRECT
  - RULE-SET,apple-proxy,Proxy
  - GEOSITE,apple,DIRECT    # GeoSite 苹果服务
  
  # 5. 国内外网站分流
  - RULE-SET,cn,DIRECT
  - RULE-SET,foreign,Proxy
  - GEOSITE,CN,DIRECT       # GeoSite 中国网站直连
  - GEOSITE,geolocation-!cn,Proxy  # GeoSite 非中国网站走代理
  
  # 6. GeoIP 规则（中国IP直连）
  - GEOIP,CN,DIRECT
  
  # 7. 默认规则（其他所有流量走代理）
  - MATCH,Proxy
